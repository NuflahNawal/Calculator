<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">

        <div class="display-container">
            <input type="text" id="display">
            <div id="history" class="history-text"></div>
            <div id="display" class="main-display"></div>
        </div>

        <div> 
            <button onclick="clearAll()" class="a">AC</button>
            <button onclick="plusMinus()" class="b">&pm;</button>
            <button onclick="operator('%')" class="b">%</button>
            <button onclick="operator('÷')" class="c">&divide;</button>
        </div>
        <div>
            <button onclick="number('7')" class="d">7</button>
            <button onclick="number('8')" class="d">8</button>
            <button onclick="number('9')" class="d">9</button>
            <button onclick="operator('x')" class="c">x</button>
        </div>
        <div>
            <button onclick="number('4')" class="d">4</button>
            <button onclick="number('5')" class="d">5</button>
            <button onclick="number('6')" class="d">6</button>
            <button onclick="operator('-')" class="c">-</button>
        </div>
        <div>
            <button onclick="number('1')" class="d">1</button>
            <button onclick="number('2')" class="d">2</button>
            <button onclick="number('3')" class="d">3</button>
            <button onclick="operator('+')" class="c">+</button>
        </div>
        <div>
            <button onclick="number('0')" class="d">0</button>
            <button onclick="number('.')" class="d">.</button>
            <button onclick="backSpace()" class="d">&#9003;</button>
            <button onclick="calculate()" class="e">=</button>
        </div>
            
    </div>
    <script src="app.js"></script>
</body>
</html>
